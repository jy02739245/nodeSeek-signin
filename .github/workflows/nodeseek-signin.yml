name: NodeSeek Signin

on:
  # 只保留手动触发
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodeseek-signin
  cancel-in-progress: false

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run NodeSeek signin
        env:
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
          NS_PROXY: ${{ secrets.NS_PROXY }}
          NS_TIMEOUT: ${{ vars.NS_TIMEOUT || '60' }}
          NS_RANDOM: ${{ vars.NS_RANDOM || 'true' }}
          FAIL_ON_ERROR: ${{ vars.FAIL_ON_ERROR || 'true' }}
          NS_IMPERSONATE: ${{ vars.NS_IMPERSONATE || 'chrome136' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TG_API_HOST: ${{ vars.TG_API_HOST }}
        run: python nodeseek_signin.py
